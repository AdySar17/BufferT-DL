<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>País — BFT Demon List</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: black url('https://iili.io/qnR6Jst.jpg') no-repeat top center fixed;
    background-size: cover;
    color: #e8f5e9;
    min-height: 100vh;
    padding-top: 70px;
  }

  /* ── HEADER ── */
  .top-header {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    z-index: 9999;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
  }
  .left { display: flex; align-items: center; gap: 10px; }
  .logo-img { width: 38px; height: 38px; }
  .logo-text { color: white; font-weight: bold; font-size: 1.1rem; }
  .nav-links { display: flex; gap: 15px; }
  .nav-links a { color: white; text-decoration: none; font-size: 0.95rem; }
  .nav-links a:hover { color: #7cfc00; }
  .menu-toggle {
    display: none;
    font-size: 28px; color: white;
    width: 40px; height: 40px;
    align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
  }
  .staff-only, .owner-only, .admin-only { display: none; }
  body.is-staff .staff-only { display: revert; }
  body.is-owner .owner-only { display: revert; }
  body.is-admin .admin-only { display: revert; }
  body.is-owner .admin-only { display: revert; }
  @media (max-width: 768px) {
    .menu-toggle { display: flex; }
    .nav-links {
      display: none; flex-direction: column;
      position: absolute; top: 60px; right: 10px;
      background: rgba(0,0,0,0.9);
      padding: 10px; border-radius: 10px; gap: 8px;
    }
    .nav-links.active { display: flex; }
  }

  /* ── LAYOUT ── */
  .page-wrap { max-width: 900px; margin: 0 auto; padding: 30px 20px 60px; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: 20px;
    padding: 7px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: rgba(220,240,220,.8);
    font-family: 'Montserrat', sans-serif; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; text-decoration: none; transition: background .2s, color .2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.12); color: white; }

  /* ── CARD ── */
  .card {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 6px 30px rgba(0,0,0,0.6);
    margin-bottom: 18px;
  }

  /* ── HEADER DE PAÍS ── */
  .country-header { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .country-flag-big { width: 90px; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,0.55); flex-shrink: 0; }
  .country-info h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
  .country-code-tag {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .72rem;
    font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    background: rgba(124,252,0,.12); border: 1px solid rgba(124,252,0,.28); color: #a8ff5b;
    margin-bottom: 8px;
  }
  .country-stats-row { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 14px; }
  .cstat { text-align: center; }
  .cstat-val { font-size: 1.4rem; font-weight: 800; color: #c7ff3b; }
  .cstat-lbl { font-size: .7rem; color: rgba(200,220,200,.65); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

  /* ── SECTION LABEL ── */
  .sec-label {
    font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .9px;
    color: rgba(199,255,59,.75); margin-bottom: 12px;
  }

  /* ── TOP PLAYERS ── */
  .tp-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 10px; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05); margin-bottom: 6px;
    cursor: pointer; transition: background .15s; text-decoration: none; color: #e8f5e9;
  }
  .tp-row:hover { background: rgba(255,255,255,0.07); }
  .tp-pos { width: 34px; font-weight: 700; font-size: .85rem; color: rgba(200,220,200,.6); text-align: center; flex-shrink: 0; }
  .tp-pos.gold   { color: #ffd700; }
  .tp-pos.silver { color: #c0c0c0; }
  .tp-pos.bronze { color: #cd7f32; }
  .tp-photo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,.05); }
  .tp-photo-fb { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(124,252,0,.12); font-size: .75rem; font-weight: 700; flex-shrink: 0; }
  .tp-name { font-weight: 600; font-size: .9rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp-pts  { font-size: .88rem; font-weight: 700; color: #7cfc00; white-space: nowrap; }

  /* ── FVN ── */
  .fvn-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 10px; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05); margin-bottom: 6px;
    text-decoration: none; color: #e8f5e9; transition: background .15s;
  }
  .fvn-row:hover { background: rgba(255,255,255,0.07); }
  .fvn-pos  { font-size: .72rem; font-weight: 700; color: rgba(199,255,59,.7); white-space: nowrap; padding: 2px 7px; border-radius: 6px; background: rgba(124,252,0,.08); }
  .fvn-lvl  { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: .9rem; }
  .fvn-player { font-size: .8rem; color: rgba(200,220,200,.65); white-space: nowrap; }
  .fvn-date   { font-size: .74rem; color: rgba(180,180,180,.45); white-space: nowrap; }

  /* ── EMPTY / STATE ── */
  .empty-msg { text-align: center; padding: 28px 0; color: rgba(200,220,200,.6); font-size: .9rem; }
  #stateMsg { text-align: center; padding: 60px 20px; color: rgba(200,220,200,.7); font-size: .95rem; }
</style>
</head>
<body>

<header class="top-header">
  <div class="left">
    <img src="https://iili.io/BN3Yhpp.png" class="logo-img" alt="Logo">
    <div class="logo-text">BFT Demon List</div>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <nav class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/demonlist.html">Demon List</a>
      <a href="/leaderboards.html">Leaderboards</a>
      <a href="/notifications.html">✉ Notificaciones</a>
      <a href="/submit.html">Enviar Record</a>
      <a href="/guidelines.html">Guidelines</a>
      <a href="/panel.html" class="staff-only">Panel de Records</a>
      <a href="/staff-control.html" class="owner-only">Control Staff</a>
      <a href="/admin-dev.html" class="admin-only">Admin Dev</a>
    </nav>
    <div class="auth-slot" id="authSlot"></div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  </div>
</header>

<script type="module">
  import { mountAuthUI, onAuthChange, isStaff } from "/auth.js";
  mountAuthUI("authSlot");
  onAuthChange(() => {
    document.body.classList.toggle("is-staff", isStaff());
  });
</script>
<script>
  function toggleMenu() {
    const el = document.getElementById("navLinks");
    if (el) el.classList.toggle("active");
  }
  window.toggleMenu = toggleMenu;
</script>

<div id="stateMsg">Cargando...</div>

<div class="page-wrap" id="pageWrap" style="display:none;">
  <a href="/leaderboards.html?cat=countries" class="back-btn">&#8592; Volver a Leaderboards</a>

  <div class="card">
    <div class="country-header">
      <img id="cpFlag" class="country-flag-big" src="" alt="">
      <div class="country-info">
        <div class="country-code-tag" id="cpCode"></div>
        <h1 id="cpName">—</h1>
        <div class="country-stats-row" id="cpStats"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sec-label">Top Jugadores</div>
    <div id="topPlayersList"><div class="empty-msg">Cargando...</div></div>
  </div>

  <div class="card" id="fvCard" style="display:none;">
    <div class="sec-label" id="fvTitle">First Victor por País — niveles completados</div>
    <div id="fvList"></div>
  </div>
</div>

<script type="module">
  import { db } from "/auth.js";
  import { collection, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { countryName, flagUrl } from "/country-utils.js";

  const code = (new URLSearchParams(location.search).get("code") || "").toLowerCase();

  if (!code) {
    document.getElementById("stateMsg").textContent = "Código de país no especificado.";
  } else {
    document.title = `${code.toUpperCase()} — BFT Demon List`;
    init(code);
  }

  async function init(code) {
    const state = document.getElementById("stateMsg");
    try {
      const profSnap = await getDocs(collection(db, "profiles"));
      const countryProfiles = new Map();
      profSnap.forEach(ps => {
        const d = ps.data() || {};
        if ((d.country || "").toLowerCase() === code)
          countryProfiles.set(ps.id, { uid: ps.id, name: d.name || "Sin nombre", photoURL: d.photoURL || "" });
      });

      if (!countryProfiles.size) {
        state.textContent = `Ningún jugador registrado de ${countryName(code) || code.toUpperCase()}.`;
        return;
      }

      const recsSnap = await getDocs(collection(db, "records"));
      const allRecs  = recsSnap.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(r => r.status === "Accepted" && Number(r.percent) > 0);

      const lvlSnap = await getDocs(collection(db, "levels"));
      const levelsMap = new Map();
      lvlSnap.forEach(d => levelsMap.set(d.id, { id: d.id, ...d.data() }));

      const playerStats = new Map();
      countryProfiles.forEach((_, uid) => playerStats.set(uid, { points: 0, records100: 0 }));
      const fullRecords = [];

      allRecs.forEach(r => {
        [r.userId, r.player2Id].filter(Boolean).forEach(uid => {
          if (!countryProfiles.has(uid)) return;
          const lvl = levelsMap.get(r.levelId);
          if (!lvl) return;
          const pct = Number(r.percent);
          const pts = pct === 100 ? Number(lvl.value || 0) : Number(lvl.value || 0) / 10;
          const st  = playerStats.get(uid);
          st.points += pts;
          if (pct === 100) st.records100++;
        });
        if (Number(r.percent) === 100 && countryProfiles.has(r.userId))
          fullRecords.push(r);
      });

      let totalPts = 0, totalRecs = 0;
      playerStats.forEach(st => { totalPts += st.points; totalRecs += st.records100; });
      totalPts = Math.round(totalPts * 100) / 100;

      const fvnMap = new Map();
      fullRecords.forEach(r => {
        const ts = r.acceptedAt?.toMillis ? r.acceptedAt.toMillis() : 0;
        if (!ts) return;
        const ex = fvnMap.get(r.levelId);
        if (!ex || ts < ex.ts) fvnMap.set(r.levelId, { levelId: r.levelId, uid: r.userId, ts, date: r.acceptedAt });
      });

      let hardestLvl = null;
      fvnMap.forEach((_, lid) => {
        const l = levelsMap.get(lid);
        if (!l) return;
        if (!hardestLvl || Number(l.position) < Number(hardestLvl.position)) hardestLvl = l;
      });

      renderHeader(code, countryProfiles.size, totalPts, totalRecs, hardestLvl);
      renderTopPlayers(playerStats, countryProfiles);
      renderFVN(fvnMap, levelsMap, countryProfiles);

      state.style.display = "none";
      document.getElementById("pageWrap").style.display = "block";
    } catch (err) {
      state.textContent = "Error al cargar: " + (err.message || err);
      console.error("[country-profile]", err);
    }
  }

  function renderHeader(code, players, pts, recs, hardest) {
    const name = countryName(code) || code.toUpperCase();
    document.title = `${name} — BFT Demon List`;
    document.getElementById("cpFlag").src = flagUrl(code);
    document.getElementById("cpFlag").alt = name;
    document.getElementById("cpCode").textContent = code.toUpperCase();
    document.getElementById("cpName").textContent = name;
    document.getElementById("cpStats").innerHTML = `
      <div class="cstat"><div class="cstat-val">${players}</div><div class="cstat-lbl">Jugadores</div></div>
      <div class="cstat"><div class="cstat-val">${pts.toLocaleString()}</div><div class="cstat-lbl">Puntos</div></div>
      <div class="cstat"><div class="cstat-val">${recs}</div><div class="cstat-lbl">Completes</div></div>
      ${hardest ? `<div class="cstat"><div class="cstat-val">#${hardest.position}</div><div class="cstat-lbl">Más difícil</div></div>` : ""}
    `;
  }

  function renderTopPlayers(playerStats, profiles) {
    const list   = document.getElementById("topPlayersList");
    const sorted = [...playerStats.entries()].sort((a, b) => b[1].points - a[1].points).slice(0, 50);
    if (!sorted.length) { list.innerHTML = `<div class="empty-msg">Sin datos.</div>`; return; }
    list.innerHTML = "";
    sorted.forEach(([uid, st], i) => {
      const p       = profiles.get(uid) || {};
      const pts     = (Math.round(st.points * 100) / 100).toLocaleString();
      const posClass = i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
      const initials = (p.name || "?").split(" ").map(n => n[0]).slice(0, 2).join("").toUpperCase();
      const photoHtml = p.photoURL
        ? `<img class="tp-photo" src="${p.photoURL}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
        : `<div class="tp-photo-fb">${initials}</div>`;
      const row = document.createElement("a");
      row.className = "tp-row";
      row.href = `/profile.html?id=${encodeURIComponent(uid)}`;
      row.innerHTML = `
        <div class="tp-pos ${posClass}">#${i + 1}</div>
        ${photoHtml}
        <div class="tp-name">${escHtml(p.name || "Sin nombre")}</div>
        <div class="tp-pts">${pts} pts</div>
      `;
      list.appendChild(row);
    });
  }

  function renderFVN(fvnMap, levelsMap, profiles) {
    if (!fvnMap.size) return;
    const card  = document.getElementById("fvCard");
    const title = document.getElementById("fvTitle");
    const list  = document.getElementById("fvList");
    const entries = [...fvnMap.values()]
      .map(e => ({ ...e, level: levelsMap.get(e.levelId) }))
      .filter(e => e.level)
      .sort((a, b) => (Number(a.level.position) || 9999) - (Number(b.level.position) || 9999));
    title.textContent = `First Victor por País — ${entries.length} nivel${entries.length !== 1 ? "es" : ""}`;
    card.style.display = "block";
    entries.forEach(e => {
      const p       = profiles.get(e.uid) || {};
      const lvl     = e.level;
      const dateStr = e.date?.toDate
        ? e.date.toDate().toLocaleDateString("es-ES", { day:"2-digit", month:"2-digit", year:"numeric" })
        : "—";
      const row = document.createElement("a");
      row.className = "fvn-row";
      row.href = `/level.html?id=${encodeURIComponent(e.levelId)}`;
      row.innerHTML = `
        <div class="fvn-pos">#${lvl.position || "?"}</div>
        <div class="fvn-lvl">${escHtml(lvl.name || "Nivel")}</div>
        <div class="fvn-player">${escHtml(p.name || "?")}</div>
        <div class="fvn-date">${dateStr}</div>
      `;
      list.appendChild(row);
    });
  }

  function escHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  }
</script>
</body>
</html>
