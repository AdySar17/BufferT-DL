<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>País — BFT Demon List</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: black url('https://iili.io/qnR6Jst.jpg') no-repeat top center fixed;
    background-size: cover;
    color: #e8f5e9;
    min-height: 100vh;
    padding-top: 70px;
  }

  /* ── HEADER ── */
  .top-header {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    z-index: 9999;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
  }
  .left { display: flex; align-items: center; gap: 10px; }
  .logo-img { width: 38px; height: 38px; }
  .logo-text { color: white; font-weight: bold; font-size: 1.1rem; }
  .nav-links { display: flex; gap: 15px; }
  .nav-links a { color: white; text-decoration: none; font-size: 0.95rem; }
  .nav-links a:hover { color: #7cfc00; }
  .menu-toggle {
    display: none;
    font-size: 28px; color: white;
    width: 40px; height: 40px;
    align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
  }
  .staff-only, .owner-only, .admin-only { display: none; }
  body.is-staff .staff-only { display: revert; }
  body.is-owner .owner-only { display: revert; }
  body.is-admin .admin-only { display: revert; }
  body.is-owner .admin-only { display: revert; }
  @media (max-width: 768px) {
    .menu-toggle { display: flex; }
    .nav-links {
      display: none; flex-direction: column;
      position: absolute; top: 60px; right: 10px;
      background: rgba(0,0,0,0.9);
      padding: 10px; border-radius: 10px; gap: 8px;
    }
    .nav-links.active { display: flex; }
  }

  /* ── LAYOUT ── */
  .page-wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 70px; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: 24px;
    padding: 7px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: rgba(220,240,220,.8);
    font-family: 'Montserrat', sans-serif; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; text-decoration: none; transition: background .2s, color .2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.12); color: white; }

  /* ── CARD ── */
  .card {
    background: rgba(5,12,5,0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(124,252,0,0.1);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    margin-bottom: 20px;
  }

  /* ── HERO COUNTRY HEADER ── */
  .country-hero {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .flag-wrapper {
    flex-shrink: 0;
    width: 100px;
    height: 70px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.7), 0 0 0 2px rgba(124,252,0,0.18);
    background: rgba(255,255,255,0.04);
  }
  .country-flag-big {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .country-info { flex: 1; min-width: 0; }
  .country-code-tag {
    display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: .68rem;
    font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
    background: rgba(124,252,0,.1); border: 1px solid rgba(124,252,0,.3); color: #a8ff5b;
    margin-bottom: 6px;
  }
  .country-info h1 {
    font-size: 1.9rem; font-weight: 800; line-height: 1.1;
    letter-spacing: -.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── STATS ROW ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 20px;
  }
  .stat-tile {
    background: rgba(124,252,0,0.05);
    border: 1px solid rgba(124,252,0,0.1);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat-tile-val {
    font-size: 1.35rem; font-weight: 800; color: #c7ff3b;
    line-height: 1;
  }
  .stat-tile-lbl {
    font-size: .66rem; color: rgba(199,240,180,.55); font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px; margin-top: 5px;
  }

  /* ── SECTION LABEL ── */
  .sec-label {
    font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: rgba(199,255,59,.6); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .sec-label::after {
    content: ""; flex: 1; height: 1px; background: rgba(124,252,0,0.1);
  }

  /* ── TOP PLAYERS ── */
  .tp-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 12px; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05); margin-bottom: 6px;
    cursor: pointer; transition: background .15s, border-color .15s;
    text-decoration: none; color: #e8f5e9;
  }
  .tp-row:hover { background: rgba(124,252,0,0.06); border-color: rgba(124,252,0,0.15); }
  .tp-pos { width: 32px; font-weight: 700; font-size: .82rem; color: rgba(200,220,200,.55); text-align: center; flex-shrink: 0; }
  .tp-pos.gold   { color: #ffd700; }
  .tp-pos.silver { color: #c0c0c0; }
  .tp-pos.bronze { color: #cd7f32; }
  .tp-photo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,.05); }
  .tp-photo-fb { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(124,252,0,.12); font-size: .72rem; font-weight: 700; color: #a8ff5b; flex-shrink: 0; }
  .tp-name { font-weight: 600; font-size: .9rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp-pts  { font-size: .85rem; font-weight: 700; color: #7cfc00; white-space: nowrap; }
  .tp-badge { font-size: .65rem; padding: 2px 7px; border-radius: 6px; margin-left: 4px; font-weight: 700; }
  .tp-badge-1 { background: rgba(255,215,0,.15); color: #ffd700; border: 1px solid rgba(255,215,0,.25); }
  .tp-badge-2 { background: rgba(192,192,192,.12); color: #c0c0c0; border: 1px solid rgba(192,192,192,.22); }
  .tp-badge-3 { background: rgba(205,127,50,.13); color: #cd7f32; border: 1px solid rgba(205,127,50,.23); }

  /* ── FVN TABLE — horizontal scroll on mobile ── */
  .fvn-scroll-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    /* subtle hint that it scrolls */
    scrollbar-width: thin;
    scrollbar-color: rgba(124,252,0,0.25) transparent;
    border-radius: 10px;
  }
  .fvn-scroll-wrap::-webkit-scrollbar { height: 4px; }
  .fvn-scroll-wrap::-webkit-scrollbar-track { background: transparent; }
  .fvn-scroll-wrap::-webkit-scrollbar-thumb { background: rgba(124,252,0,0.25); border-radius: 4px; }

  .fvn-table {
    width: 100%;
    min-width: 520px; /* forces scroll on narrow screens */
    border-collapse: collapse;
  }
  .fvn-table thead th {
    font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
    color: rgba(199,255,59,.5); padding: 6px 10px 10px; text-align: left;
    border-bottom: 1px solid rgba(124,252,0,0.1);
    white-space: nowrap;
  }
  .fvn-table thead th:last-child { text-align: right; }
  .fvn-table tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background .12s;
    cursor: pointer;
  }
  .fvn-table tbody tr:last-child { border-bottom: none; }
  .fvn-table tbody tr:hover { background: rgba(124,252,0,0.05); }
  .fvn-table td { padding: 9px 10px; font-size: .88rem; white-space: nowrap; }
  .fvn-td-pos {
    font-size: .72rem; font-weight: 700; color: rgba(199,255,59,.75);
    padding: 3px 9px; border-radius: 7px; background: rgba(124,252,0,.08);
    display: inline-block;
  }
  .fvn-td-name { font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fvn-td-player { color: rgba(200,220,200,.65); }
  .fvn-td-date { color: rgba(180,180,180,.45); font-size: .76rem; text-align: right; }

  /* ── EMPTY / STATE ── */
  .empty-msg { text-align: center; padding: 32px 0; color: rgba(200,220,200,.5); font-size: .9rem; }
  #stateMsg {
    text-align: center; padding: 80px 20px;
    color: rgba(200,220,200,.7); font-size: .95rem;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .state-spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid rgba(124,252,0,0.15);
    border-top-color: rgba(124,252,0,0.6);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .country-hero { gap: 16px; }
    .flag-wrapper { width: 72px; height: 50px; border-radius: 10px; }
    .country-info h1 { font-size: 1.4rem; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .stat-tile-val { font-size: 1.1rem; }
    .card { padding: 16px 14px; border-radius: 16px; }
    .page-wrap { padding: 20px 12px 60px; }
  }
</style>
  <script src="/i18n.js"></script>
  <script>document.addEventListener('DOMContentLoaded',function(){if(window.BFT_I18N)window.BFT_I18N.renderSelector('langSlot');});</script>
</head>
<body>

<header class="top-header">
  <div class="left">
    <img src="/logo.png" class="logo-img" alt="Logo">
    <div class="logo-text"><span class="logo-full">BFT Demon List</span><span class="logo-short">BFT DL</span></div>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <nav class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/demonlist.html">Demon List</a>
      <a href="/leaderboards.html">Leaderboards</a>
      <a href="/notifications.html">✉ Notificaciones</a>
      <a href="/submit.html">Enviar Record</a>
      <a href="/guidelines.html">Guidelines</a>
      <a href="/panel.html" class="staff-only">Panel de Records</a>
      <a href="/staff-control.html" class="owner-only">Control Staff</a>
      <a href="/admin-dev.html" class="admin-only">Admin Dev</a>
    </nav>
    <div id="langSlot"></div>
    <div class="auth-slot" id="authSlot"></div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  </div>
</header>

<script type="module">
  import { mountAuthUI, onAuthChange, isStaff } from "/auth.js";
  mountAuthUI("authSlot");
  onAuthChange(() => {
    document.body.classList.toggle("is-staff", isStaff());
  });
</script>
<script>
  function toggleMenu() {
    const el = document.getElementById("navLinks");
    if (el) el.classList.toggle("active");
  }
  window.toggleMenu = toggleMenu;
</script>

<div id="stateMsg">
  <div class="state-spinner"></div>
  Cargando...
</div>

<div class="page-wrap" id="pageWrap" style="display:none;">
  <a href="/leaderboards.html?cat=countries" class="back-btn">&#8592; Volver a Leaderboards</a>

  <!-- HERO -->
  <div class="card">
    <div class="country-hero">
      <div class="flag-wrapper">
        <img id="cpFlag" class="country-flag-big" src="" alt="">
      </div>
      <div class="country-info">
        <div class="country-code-tag" id="cpCode"></div>
        <h1 id="cpName">—</h1>
      </div>
    </div>
    <div class="stats-grid" id="cpStats"></div>
  </div>

  <!-- TOP PLAYERS -->
  <div class="card">
    <div class="sec-label">Top Jugadores</div>
    <div id="topPlayersList"><div class="empty-msg">Cargando...</div></div>
  </div>

  <!-- FIRST VICTORS -->
  <div class="card" id="fvCard" style="display:none;">
    <div class="sec-label" id="fvTitle">First Victor por País</div>
    <!-- scroll wrapper -->
    <div class="fvn-scroll-wrap">
      <table class="fvn-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nivel</th>
            <th>Jugador</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="fvList"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
  import { db } from "/auth.js";
  import { collection, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { countryName, flagUrl } from "/country-utils.js";

  const code = (new URLSearchParams(location.search).get("code") || "").toLowerCase();

  if (!code) {
    const s = document.getElementById("stateMsg");
    s.innerHTML = "Código de país no especificado.";
  } else {
    document.title = `${code.toUpperCase()} — BFT Demon List`;
    init(code);
  }

  async function init(code) {
    const state = document.getElementById("stateMsg");
    try {
      const profSnap = await getDocs(collection(db, "profiles"));
      const countryProfiles = new Map();
      profSnap.forEach(ps => {
        const d = ps.data() || {};
        if ((d.country || "").toLowerCase() === code)
          countryProfiles.set(ps.id, { uid: ps.id, name: d.name || "Sin nombre", photoURL: d.photoURL || "" });
      });

      if (!countryProfiles.size) {
        state.innerHTML = `Ningún jugador registrado de <b>${countryName(code) || code.toUpperCase()}</b>.`;
        return;
      }

      const recsSnap = await getDocs(collection(db, "records"));
      const allRecs  = recsSnap.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(r => r.status === "Accepted" && Number(r.percent) > 0);

      const lvlSnap = await getDocs(collection(db, "levels"));
      const levelsMap = new Map();
      lvlSnap.forEach(d => levelsMap.set(d.id, { id: d.id, ...d.data() }));

      const playerStats = new Map();
      countryProfiles.forEach((_, uid) => playerStats.set(uid, { points: 0, records100: 0 }));
      const fullRecords = [];

      allRecs.forEach(r => {
        [r.userId, r.player2Id].filter(Boolean).forEach(uid => {
          if (!countryProfiles.has(uid)) return;
          const lvl = levelsMap.get(r.levelId);
          if (!lvl) return;
          const pct = Number(r.percent);
          const pts = pct === 100 ? Number(lvl.value || 0) : Number(lvl.value || 0) / 10;
          const st  = playerStats.get(uid);
          st.points += pts;
          if (pct === 100) st.records100++;
        });
        if (Number(r.percent) === 100 && countryProfiles.has(r.userId))
          fullRecords.push(r);
      });

      let totalPts = 0, totalRecs = 0;
      playerStats.forEach(st => { totalPts += st.points; totalRecs += st.records100; });
      totalPts = Math.round(totalPts * 100) / 100;

      const fvnMap = new Map();
      fullRecords.forEach(r => {
        const ts = r.acceptedAt?.toMillis ? r.acceptedAt.toMillis() : 0;
        if (!ts) return;
        const ex = fvnMap.get(r.levelId);
        if (!ex || ts < ex.ts) fvnMap.set(r.levelId, { levelId: r.levelId, uid: r.userId, ts, date: r.acceptedAt });
      });

      let hardestLvl = null;
      fvnMap.forEach((_, lid) => {
        const l = levelsMap.get(lid);
        if (!l) return;
        if (!hardestLvl || Number(l.position) < Number(hardestLvl.position)) hardestLvl = l;
      });

      renderHeader(code, countryProfiles.size, totalPts, totalRecs, hardestLvl);
      renderTopPlayers(playerStats, countryProfiles);
      renderFVN(fvnMap, levelsMap, countryProfiles);

      state.style.display = "none";
      document.getElementById("pageWrap").style.display = "block";
    } catch (err) {
      state.innerHTML = "Error al cargar: " + escHtml(err.message || String(err));
      console.error("[country-profile]", err);
    }
  }

  function renderHeader(code, players, pts, recs, hardest) {
    const name = countryName(code) || code.toUpperCase();
    document.title = `${name} — BFT Demon List`;

    const flagEl = document.getElementById("cpFlag");
    flagEl.src = flagUrl(code);
    flagEl.alt = name;
    /* SVG fallback: if browser can't load SVG, try large PNG */
    flagEl.onerror = () => { flagEl.src = flagUrl(code, 'large'); flagEl.onerror = null; };

    document.getElementById("cpCode").textContent = code.toUpperCase();
    document.getElementById("cpName").textContent = name;

    const statsGrid = document.getElementById("cpStats");
    const tiles = [
      { val: players, lbl: "Jugadores" },
      { val: pts.toLocaleString("es"), lbl: "Puntos totales" },
      { val: recs, lbl: "Completes" },
    ];
    if (hardest) tiles.push({ val: `#${hardest.position}`, lbl: hardest.name || "Hardest" });
    statsGrid.innerHTML = tiles.map(t => `
      <div class="stat-tile">
        <div class="stat-tile-val">${t.val}</div>
        <div class="stat-tile-lbl">${escHtml(t.lbl)}</div>
      </div>`).join("");
  }

  function renderTopPlayers(playerStats, profiles) {
    const list   = document.getElementById("topPlayersList");
    const sorted = [...playerStats.entries()].sort((a, b) => b[1].points - a[1].points).slice(0, 50);
    if (!sorted.length) { list.innerHTML = `<div class="empty-msg">Sin datos.</div>`; return; }
    list.innerHTML = "";
    sorted.forEach(([uid, st], i) => {
      const p       = profiles.get(uid) || {};
      const pts     = (Math.round(st.points * 100) / 100).toLocaleString("es");
      const posClass = i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
      const initials = (p.name || "?").split(" ").map(n => n[0]).slice(0, 2).join("").toUpperCase();
      const photoHtml = p.photoURL
        ? `<img class="tp-photo" src="${p.photoURL}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
        : `<div class="tp-photo-fb">${initials}</div>`;
      const medalBadge = i < 3
        ? `<span class="tp-badge tp-badge-${i+1}">${["🥇","🥈","🥉"][i]}</span>`
        : "";
      const row = document.createElement("a");
      row.className = "tp-row";
      row.href = `/profile.html?id=${encodeURIComponent(uid)}`;
      row.innerHTML = `
        <div class="tp-pos ${posClass}">#${i + 1}</div>
        ${photoHtml}
        <div class="tp-name">${escHtml(p.name || "Sin nombre")}${medalBadge}</div>
        <div class="tp-pts">${pts} pts</div>
      `;
      list.appendChild(row);
    });
  }

  function renderFVN(fvnMap, levelsMap, profiles) {
    if (!fvnMap.size) return;
    const card  = document.getElementById("fvCard");
    const title = document.getElementById("fvTitle");
    const tbody = document.getElementById("fvList");
    const entries = [...fvnMap.values()]
      .map(e => ({ ...e, level: levelsMap.get(e.levelId) }))
      .filter(e => e.level)
      .sort((a, b) => (Number(a.level.position) || 9999) - (Number(b.level.position) || 9999));
    title.textContent = `First Victor — ${entries.length} nivel${entries.length !== 1 ? "es" : ""}`;
    card.style.display = "block";
    entries.forEach(e => {
      const p       = profiles.get(e.uid) || {};
      const lvl     = e.level;
      const dateStr = e.date?.toDate
        ? e.date.toDate().toLocaleDateString("es-ES", { day:"2-digit", month:"2-digit", year:"numeric" })
        : "—";
      const tr = document.createElement("tr");
      tr.style.cursor = "pointer";
      tr.addEventListener("click", () => { location.href = `/level.html?id=${encodeURIComponent(e.levelId)}`; });
      tr.innerHTML = `
        <td><span class="fvn-td-pos">#${lvl.position || "?"}</span></td>
        <td class="fvn-td-name">${escHtml(lvl.name || "Nivel")}</td>
        <td class="fvn-td-player">${escHtml(p.name || "?")}</td>
        <td class="fvn-td-date">${dateStr}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function escHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  }
</script>
</body>
</html>
